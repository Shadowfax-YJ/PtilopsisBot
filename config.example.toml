# Copy to config.toml. Use the same token in NapCat's WebSocket client.
group_id = 1095012141
access_token = ""
port = 8080
data_dir = "data"

# Group cleanup is part of the core workflow. Use false only to pause it.
auto_delete = true
# Set to 0 to free group space immediately after local checks pass.
delete_grace_hours = 24
max_file_mib = 256
min_free_gib = 2
# One download slot is reserved for live uploads when this is greater than 1.
download_concurrency = 3

# Optional trusted local command plugins; paths are relative to this config file.
# Installed Python plugin packages are discovered automatically; JSON is an optional override.
# Neither commands nor plugins are discovered in uploads.
# disabled_plugins = ["example-plugin"]
plugin_configs = []

# Default policy preserves run-YYYYMMDD-HHMMSS-ffffff.zip behavior.
# For generic files, configure name_pattern, time_format = "", and validation = "bytes".
# See docs/plugins.md for TOML examples.
