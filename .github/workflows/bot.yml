name: Bot checks
on:
  push:
    branches: ['master', 'codex/open-source']
    paths: ['ptilopsisbot/**', 'tests/**', 'pyproject.toml', 'config.example.toml', '.github/workflows/bot.yml']
  pull_request:
    branches: ['master']
    paths: ['ptilopsisbot/**', 'tests/**', 'pyproject.toml', 'config.example.toml', '.github/workflows/bot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check ptilopsisbot tests
      - run: python -m mypy
      - run: python -X utf8 -m pytest -q
